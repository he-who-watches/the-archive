<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Dimensional Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #0b0a12;
    --void-deep: #050409;
    --card-bg: #14121d;
    --card-bg-hover: #1a1826;
    --line: rgba(180,144,63,0.22);
    --brass: #b4903f;
    --brass-bright: #dab868;
    --parchment: #d8d2c4;
    --muted: #8b8578;
    --violet: #a58bd6;
    --violet-glow: rgba(147,118,201,0.28);
    --stamp-red: #8a3324;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--void);
    color: var(--parchment);
    font-family: 'EB Garamond', serif;
    min-height: 100vh;
  }

  body{
    background-image:
      radial-gradient(ellipse 60% 40% at 20% 0%, rgba(90,60,140,0.10), transparent 60%),
      radial-gradient(ellipse 50% 35% at 85% 15%, rgba(60,40,100,0.08), transparent 60%),
      var(--void);
    background-attachment: fixed;
  }

  @media (prefers-reduced-motion: no-preference){
    body{
      animation: driftGlow 40s ease-in-out infinite alternate;
    }
  }
  @keyframes driftGlow{
    0%{ background-position: 0% 0%, 100% 0%; }
    100%{ background-position: 10% 15%, 85% 20%; }
  }

  a{ color: inherit; text-decoration: none; }

  .wrap{
    max-width: 880px;
    margin: 0 auto;
    padding: 48px 20px 100px;
  }

  header.site-head{
    text-align: center;
    margin-bottom: 40px;
  }

  .eye-mark{
    width: 34px; height: 34px;
    margin: 0 auto 18px;
    opacity: 0.85;
  }

  h1.site-title{
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 42px);
    letter-spacing: 0.14em;
    color: var(--brass-bright);
    margin: 0 0 10px;
    text-shadow: 0 0 24px rgba(218,184,104,0.18);
  }

  .site-sub{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .site-sub em{
    font-style: normal;
    color: var(--violet);
  }

  nav.tabs{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 36px;
    padding-bottom: 0;
  }

  .tab-btn{
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    background: transparent;
    border: none;
    padding: 12px 16px;
    cursor: pointer;
    position: relative;
    transition: color 0.25s ease;
  }
  .tab-btn:hover{ color: var(--parchment); }
  .tab-btn.active{ color: var(--brass-bright); }
  .tab-btn.active::after{
    content: "";
    position: absolute;
    left: 10%; right: 10%; bottom: -1px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--brass-bright), transparent);
    box-shadow: 0 0 10px rgba(218,184,104,0.5);
  }

  /* ---- What Remains: entry grid ---- */
  .entry-grid{
    display: grid;
    gap: 14px;
  }

  .entry-card{
    display: block;
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-left: 2px solid var(--brass);
    padding: 18px 20px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
  }
  .entry-card:hover{
    background: var(--card-bg-hover);
    border-left-color: var(--brass-bright);
    transform: translateX(2px);
  }

  .entry-id{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.1em;
    color: var(--brass-bright);
    margin-bottom: 8px;
  }

  .entry-teaser{
    font-style: italic;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 0.02em;
    line-height: 1.6;
    color: var(--violet);
    text-shadow: 0 0 18px var(--violet-glow);
  }

  /* ---- Detail page ---- */
  .back-link{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 28px;
    cursor: pointer;
  }
  .back-link:hover{ color: var(--brass-bright); }

  .redacted-plate{
    position: relative;
    width: 100%;
    max-width: 320px;
    aspect-ratio: 3 / 4;
    margin: 0 auto 32px;
    background:
      repeating-linear-gradient(135deg, #0d0c14 0 2px, #0a0910 2px 4px);
    border: 1px solid var(--line);
  }
  .redacted-plate::before,
  .redacted-plate::after,
  .redacted-plate .corner-tl,
  .redacted-plate .corner-br{
    content: "";
    position: absolute;
    width: 22px; height: 22px;
    border: 1.5px solid var(--brass);
  }
  .redacted-plate::before{ top: 10px; left: 10px; border-right: none; border-bottom: none; }
  .redacted-plate::after{ bottom: 10px; right: 10px; border-left: none; border-top: none; }

  .stamp{
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-9deg);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.18em;
    color: var(--stamp-red);
    border: 3px solid var(--stamp-red);
    padding: 8px 14px;
    text-align: center;
    opacity: 0.82;
    mix-blend-mode: screen;
  }
  .stamp small{
    display: block;
    font-size: 9px;
    letter-spacing: 0.3em;
    margin-top: 4px;
    opacity: 0.85;
  }

  .dossier{
    max-width: 560px;
    margin: 0 auto;
  }

  .field-row{
    display: grid;
    grid-template-columns: 130px 1fr;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .field-label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    padding-top: 3px;
  }
  .field-value{
    font-family: 'Cinzel', serif;
    font-size: 16px;
    letter-spacing: 0.04em;
    color: var(--parchment);
  }
  .field-value.status{
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--brass-bright);
  }

  .watcher-note{
    margin-top: 30px;
    padding: 22px 24px;
    border-top: 1px solid var(--brass);
    background: linear-gradient(180deg, rgba(147,118,201,0.05), transparent);
  }
  .watcher-note-label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--muted);
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .watcher-note-text{
    font-style: italic;
    font-weight: 500;
    font-size: 17px;
    line-height: 1.85;
    letter-spacing: 0.02em;
    color: var(--violet);
    text-shadow: 0 0 20px var(--violet-glow);
  }

  /* ---- placeholder tabs ---- */
  .placeholder{
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    border: 1px dashed var(--line);
  }

  .view{
    animation: fadeIn 0.35s ease;
  }
  @media (prefers-reduced-motion: reduce){
    .view{ animation: none; }
  }
  @keyframes fadeIn{
    from{ opacity: 0; transform: translateY(6px); }
    to{ opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="site-head">
    <svg class="eye-mark" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 50C20 20 80 20 95 50C80 80 20 80 5 50Z" stroke="#b4903f" stroke-width="2"/>
      <circle cx="50" cy="50" r="14" stroke="#a58bd6" stroke-width="2"/>
      <circle cx="50" cy="50" r="4" fill="#a58bd6"/>
    </svg>
    <h1 class="site-title">The Dimensional Archive</h1>
    <div class="site-sub">kept by <em>The Watcher</em></div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main id="content"></main>
</div>

<script>
const TABS = [
  { id: "remains", label: "What Remains" },
  { id: "personnel", label: "Personnel" },
  { id: "dimensions", label: "Dimensions" },
  { id: "how", label: "\u201CHow?\u201D" },
  { id: "phenomena", label: "Phenomena" },
];

const ENTRIES = [
  {
    id: "R-001",
    name: "V",
    knownAs: "\u201CV+\u201D",
    status: "Allegedly alive",
    teaser: "𝑺𝑶, 𝑺𝑶 𝑴𝑼𝑪𝑯 𝑻𝑯𝑬𝒀 𝑯𝑨𝑽𝑬 𝒀𝑬𝑻 𝑻𝑶 𝑳𝑬𝑨𝑹𝑵 𝑨𝑩𝑶𝑼𝑻 𝑯𝑰𝑴",
    note: "𝑯𝑶𝑾 𝑰𝑵𝑻𝑬𝑹𝑬𝑺𝑻𝑰𝑵𝑮, 𝑨 𝑷𝑼𝑹𝑬 𝑺𝑶𝑼𝑳 𝑪𝑶𝑴𝑬𝑺 𝑶𝑼𝑻 𝑭𝑹𝑶𝑴 𝑻𝑯𝑨𝑻 𝑯𝑬𝑳𝑳 𝑨𝑵𝑫 𝑺𝑻𝑰𝑳𝑳 𝑭𝑰𝑵𝑫𝑺 𝑨 𝑾𝑨𝒀 𝑻𝑶 𝑪𝑨𝑹𝑹𝒀 𝑻𝑯𝑬 𝑪𝑯𝑨𝑰𝑵 𝑶𝑭 𝑪𝑶𝑴𝑷𝑨𝑺𝑺𝑰𝑶𝑵\n𝑰𝑻'𝑺 𝑨𝑳𝑴𝑶𝑺𝑻 𝑺𝑨𝑫𝑫𝑬𝑵𝑰𝑵𝑮 𝑯𝑶𝑾 𝑳𝑰𝑻𝑻𝑳𝑬 𝑻𝑯𝑬𝒀 𝑲𝑵𝑶𝑾 𝑨𝑩𝑶𝑼𝑻 𝑯𝑰𝑴, 𝑩𝑼𝑻 𝒀𝑬𝑻, 𝑻𝑯𝑬𝒀 𝑨𝑺𝑲 𝑨𝑵𝑫 𝑾𝑶𝑵𝑫𝑬𝑹"
  },
  {
    id: "R-002",
    name: "Nihil",
    knownAs: "NaN",
    status: "More information needed",
    teaser: "𝑯𝑨𝑻𝑹𝑬𝑫, 𝑷𝑼𝑹𝑬 𝑨𝑵𝑫 𝑼𝑵𝑭𝑰𝑳𝑻𝑬𝑹𝑬𝑫 𝑯𝑨𝑻𝑹𝑬𝑫",
    note: "𝑯𝑨𝑻𝑹𝑬𝑫, 𝑷𝑼𝑹𝑬 𝑨𝑵𝑫 𝑼𝑵𝑭𝑰𝑳𝑻𝑬𝑹𝑬𝑫 𝑯𝑨𝑻𝑹𝑬𝑫\n𝑰 𝑫𝑶 𝑵𝑶𝑻 𝑩𝑳𝑨𝑴𝑬 𝑯𝑰𝑴, 𝑯𝑰𝑺 𝑷𝑯𝑰𝑳𝑶𝑺𝑶𝑷𝑯𝒀 𝑾𝑨𝑺 𝑪𝑶𝑹𝑹𝑬𝑪𝑻 𝑶𝑵 𝑴𝑨𝑵𝒀 𝑨𝑪𝑪𝑶𝑼𝑵𝑻𝑺\n𝑩𝑼𝑻 𝑮𝑰𝑽𝑬𝑵 𝑻𝑯𝑬 𝑷𝑶𝑾𝑬𝑹 𝑻𝑶 𝑫𝑬𝑺𝑻𝑹𝑶𝒀, 𝑯𝑬 𝑺𝑯𝑨𝑳𝑳 𝑼𝑺𝑬 𝑰𝑻"
  },
  {
    id: "R-003",
    name: "Lio",
    knownAs: "Lio",
    status: "Alive",
    teaser: "𝑻𝑯𝑬𝒀 𝑯𝑨𝑽𝑬 𝒀𝑬𝑻 𝑻𝑶 𝑴𝑬𝑬𝑻, 𝑺𝑶 𝑪𝑳𝑶𝑺𝑬 𝒀𝑬𝑻 𝑺𝑶 𝑭𝑨𝑹",
    note: "𝑻𝑯𝑬𝒀 𝑯𝑨𝑽𝑬 𝒀𝑬𝑻 𝑻𝑶 𝑴𝑬𝑬𝑻, 𝑺𝑶 𝑪𝑳𝑶𝑺𝑬 𝒀𝑬𝑻 𝑺𝑶 𝑭𝑨𝑹\n𝑰 𝑾𝑶𝑵𝑫𝑬𝑹\u2026 𝑾𝑯𝑨𝑻 𝑴𝑨𝑲𝑬𝑺 𝑯𝑰𝑺 𝑫𝑰𝑴𝑬𝑵𝑺𝑰𝑶𝑵 𝑰𝑭 𝑵𝑶𝑻 𝑳𝑶𝑽𝑬? 𝑭𝑶𝑹 𝑰𝑻 𝑰𝑺 𝑨𝑳𝑳 𝑩𝑳𝑼𝑹𝑹𝒀 𝑰𝑵 𝑴𝒀 𝑺𝑰𝑮𝑯𝑻"
  }
];

const tabsEl = document.getElementById("tabs");
const contentEl = document.getElementById("content");

function renderTabs(activeTab){
  tabsEl.innerHTML = TABS.map(t =>
    `<button class="tab-btn ${t.id === activeTab ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`
  ).join("");
  tabsEl.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      location.hash = "#/tab/" + btn.dataset.tab;
    });
  });
}

function renderRemains(){
  contentEl.innerHTML = `
    <div class="view entry-grid">
      ${ENTRIES.map(e => `
        <a class="entry-card" data-id="${e.id}">
          <div class="entry-id">${e.id}</div>
          <div class="entry-teaser">${e.teaser}</div>
        </a>
      `).join("")}
    </div>
  `;
  contentEl.querySelectorAll(".entry-card").forEach(card=>{
    card.addEventListener("click", ()=>{
      location.hash = "#/entry/" + card.dataset.id;
    });
  });
}

function renderPlaceholder(label){
  contentEl.innerHTML = `
    <div class="view placeholder">Archive Incomplete \u2014 ${label} not yet catalogued</div>
  `;
}

function renderEntry(id){
  const e = ENTRIES.find(x => x.id === id);
  if(!e){
    contentEl.innerHTML = `<div class="view placeholder">No such record: ${id}</div>`;
    return;
  }
  contentEl.innerHTML = `
    <div class="view">
      <div class="back-link" id="backBtn">&larr; back to what remains</div>

      <div class="redacted-plate">
        <div class="stamp">WITHHELD<small>image not on file</small></div>
      </div>

      <div class="dossier">
        <div class="field-row">
          <div class="field-label">ID</div>
          <div class="field-value">${e.id}</div>
        </div>
        <div class="field-row">
          <div class="field-label">Name</div>
          <div class="field-value">${e.name}</div>
        </div>
        <div class="field-row">
          <div class="field-label">Known as</div>
          <div class="field-value">${e.knownAs}</div>
        </div>
        <div class="field-row">
          <div class="field-label">Status</div>
          <div class="field-value status">${e.status}</div>
        </div>

        <div class="watcher-note">
          <div class="watcher-note-label">More info</div>
          <div class="watcher-note-text">${e.note.split("\n").join("<br>")}</div>
        </div>
      </div>
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", ()=>{
    location.hash = "#/tab/remains";
  });
}

function route(){
  const hash = location.hash || "#/tab/remains";
  const parts = hash.replace("#/", "").split("/");

  if(parts[0] === "entry"){
    renderTabs(null);
    renderEntry(parts[1]);
    window.scrollTo(0,0);
    return;
  }

  const tabId = parts[1] || "remains";
  renderTabs(tabId);

  if(tabId === "remains"){
    renderRemains();
  } else {
    const t = TABS.find(t => t.id === tabId);
    renderPlaceholder(t ? t.label : "This section");
  }
  window.scrollTo(0,0);
}

window.addEventListener("hashchange", route);
route();
</script>

</body>
</html>
